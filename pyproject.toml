[project]
name = "multi-target-pic50-predictor"
version = "2.1.0"
description = "Multi-target pIC50 prediction and drug-discovery triage pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "chembl-webresource-client>=0.10.9",
    "matplotlib>=3.5.0",
    "numpy>=1.26.0",
    "ollama>=0.1.0",
    "optuna>=3.6.0",
    "pandas>=2.1.0",
    "pillow>=12.3.0",
    "pytorch-lightning>=2.0.0",
    "rdkit>=2024.3.1",
    "requests>=2.28.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "shap>=0.44.0",
    "torch>=2.3.0",
    "tqdm>=4.64.0",
    "typer>=0.9.0",
    "umap-learn>=0.5.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
]
gnn = [
    "torch-geometric>=2.5.0",
]
workflow = [
    "prefect>=2.19.0",
]
prod = [
    "alembic>=1.12.0",
    "fastapi>=0.104.0",
    "gunicorn>=21.2.0; platform_system != 'Windows'",
    "hiredis>=2.2.0; platform_system != 'Windows'",
    "httpx>=0.25.0",
    "orjson>=3.9.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.19.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "PyJWT[crypto]>=2.12.0",
    "python-multipart>=0.0.31",
    "redis>=5.0.0",
    "sentry-sdk[fastapi]>=1.38.0",
    "sqlalchemy>=2.0.0",
    "structlog>=23.2.0",
    "ujson>=5.13.0",
    "uvicorn[standard]>=0.24.0",
]
structure = [
    "biopython>=1.83",
    "gemmi>=0.6.7",
    "meeko>=0.6.1",
]

[dependency-groups]
dev = [
    "black>=23.11.0",
    "flake8>=6.1.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
