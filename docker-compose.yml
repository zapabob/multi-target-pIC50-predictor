version: '3.8'

services:
  # DAT Activity Predictor + TxGemma AI メインアプリケーション
  dat-predictor:
    build: .
    container_name: dat-predictor-app
    ports:
      - "8000:8000"  # FastAPI
      - "8001:8001"  # GUI (if needed)
    environment:
      - ENV=production
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=postgresql://dat_user:dat_password@postgres:5432/dat_predictor
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - MODEL_CACHE_DIR=/app/cache/models
      - DATA_CACHE_DIR=/app/cache/data
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./config:/app/config
    depends_on:
      - postgres
      - redis
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # PostgreSQL データベース
  postgres:
    image: postgres:15-alpine
    container_name: dat-predictor-db
    environment:
      - POSTGRES_DB=dat_predictor
      - POSTGRES_USER=dat_user
      - POSTGRES_PASSWORD=dat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis キャッシュ
  redis:
    image: redis:7-alpine
    container_name: dat-predictor-cache
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Ollama (TxGemma-9B)
  ollama:
    image: ollama/ollama:latest
    container_name: dat-predictor-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Nginx リバースプロキシ
  nginx:
    image: nginx:alpine
    container_name: dat-predictor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - dat-predictor
    restart: unless-stopped

  # Prometheus 監視
  prometheus:
    image: prom/prometheus:latest
    container_name: dat-predictor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana ダッシュボード
  grafana:
    image: grafana/grafana:latest
    container_name: dat-predictor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: dat-predictor-network
