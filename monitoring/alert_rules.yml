# DAT Activity Predictor + TxGemma AI - Alert Rules

groups:
  - name: dat_predictor_alerts
    rules:
      # Application alerts
      - alert: ApplicationDown
        expr: up{job="dat-predictor"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DAT Activity Predictor application is down"
          description: "The DAT Activity Predictor application has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(dat_predictor_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second over the last 5 minutes."

      - alert: HighPredictionLatency
        expr: histogram_quantile(0.95, rate(dat_predictor_prediction_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High prediction latency"
          description: "95th percentile prediction latency is {{ $value }} seconds."

      # System resource alerts
      - alert: HighCPUUsage
        expr: dat_predictor_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% for more than 5 minutes."

      - alert: HighMemoryUsage
        expr: dat_predictor_memory_usage_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% for more than 5 minutes."

      - alert: HighGPUMemoryUsage
        expr: dat_predictor_gpu_memory_usage_percent > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High GPU memory usage"
          description: "GPU memory usage is {{ $value }}% for more than 2 minutes."

      - alert: HighDiskUsage
        expr: dat_predictor_disk_usage_percent > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value }}% for more than 5 minutes."

      # Database alerts
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is down"
          description: "The PostgreSQL database has been down for more than 1 minute."

      - alert: DatabaseConnectionsHigh
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connections"
          description: "Database has {{ $value }} active connections."

      # Redis alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}% of maximum."

      # TxGemma/Ollama alerts
      - alert: OllamaDown
        expr: up{job="ollama"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Ollama is down"
          description: "Ollama has been down for more than 2 minutes."

      - alert: HighTxGemmaLatency
        expr: histogram_quantile(0.95, rate(dat_predictor_txgemma_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High TxGemma latency"
          description: "95th percentile TxGemma latency is {{ $value }} seconds."

      # Training alerts
      - alert: TrainingFailure
        expr: increase(dat_predictor_training_duration_seconds_count[1h]) == 0 and increase(dat_predictor_errors_total{component="training"}[1h]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Training failures detected"
          description: "No successful training sessions in the last hour, but errors were detected."

      - alert: LowTrainingAccuracy
        expr: dat_predictor_training_r2 < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low training accuracy"
          description: "Training R² score is {{ $value }}, which is below acceptable threshold."

      # Active learning alerts
      - alert: NoActiveLearningSuggestions
        expr: increase(dat_predictor_active_learning_suggestions_total[1h]) == 0
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "No active learning suggestions"
          description: "No active learning suggestions have been generated in the last 2 hours."

      # Cache alerts
      - alert: LowCacheHitRate
        expr: rate(dat_predictor_cache_hits_total[5m]) / (rate(dat_predictor_cache_hits_total[5m]) + rate(dat_predictor_cache_misses_total[5m])) < 0.7
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value }}%, which is below 70%."

      # Network alerts
      - alert: HighNetworkLatency
        expr: histogram_quantile(0.95, rate(nginx_http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network latency"
          description: "95th percentile network latency is {{ $value }} seconds."

      - alert: HighRequestRate
        expr: rate(nginx_http_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request rate"
          description: "Request rate is {{ $value }} requests per second."

      # Security alerts
      - alert: HighFailedLoginAttempts
        expr: rate(dat_predictor_errors_total{error_type="authentication"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High failed login attempts"
          description: "Failed login attempt rate is {{ $value }} per second."

      - alert: SuspiciousActivity
        expr: rate(dat_predictor_errors_total{error_type="security"}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Suspicious activity detected"
          description: "Security-related errors detected at rate {{ $value }} per second."
